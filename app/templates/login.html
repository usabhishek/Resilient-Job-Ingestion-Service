{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>Log in</h1>
    {% if message %}<div class="alert success">{{ message }}</div>{% endif %}
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="stack">
        <label>Email <input type="email" name="email" value="{{ email or '' }}" required autofocus></label>
        <label>Password <input type="password" name="password" required></label>
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <p class="muted"><a href="/forgot-password">Forgot password?</a> &middot; <a href="/signup">Create an account</a></p>
</div>
{% endblock %}
